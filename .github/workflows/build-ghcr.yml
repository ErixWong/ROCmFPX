name: Build and publish ROCmFPX image

on:
  workflow_dispatch:
    inputs:
      target:
        description: Docker target to build
        required: true
        type: choice
        default: light
        options:
          - light
          - server
          - full

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devops/strix-rocmfp4.Dockerfile
          target: ${{ inputs.target }}
          push: true
          build-args: CMAKE_HIP_ARCHITECTURES=gfx1151
          tags: ${{ steps.image.outputs.name }}:strix-rocmfp4-${{ inputs.target }}
          cache-from: type=gha
          cache-to: type=gha,mode=max